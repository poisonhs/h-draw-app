name: 发布版本

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解析版本号
        id: version
        run: |
          TAG=${GITHUB_REF_NAME#v}
          echo "version_name=$TAG" >> $GITHUB_OUTPUT
          # 1.0.9 → 109（与 manifest.versionCode 规则一致）
          CODE=$(echo "$TAG" | awk -F. '{print $1*100 + $2*10 + $3}')
          echo "version_code=$CODE" >> $GITHUB_OUTPUT

      - name: 更新 version.json 并推到 main
        run: |
          cat > version.json << EOF
          {
            "versionCode": ${{ steps.version.outputs.version_code }},
            "versionName": "${{ steps.version.outputs.version_name }}",
            "url": "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/h-draw-app.apk",
            "note": "新版本发布"
          }
          EOF
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git fetch origin main
          git checkout -B main origin/main
          git add version.json
          git commit -m "chore: version ${{ steps.version.outputs.version_name }}" || true
          git push origin main || true

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: H-DRAW ${{ steps.version.outputs.version_name }}
          body: |
            ## H-DRAW ${{ steps.version.outputs.version_name }}

            ### 下载
            请将本机 HBuilderX 打包的 **Android APK** 上传到本 Release：
            - 文件名建议：`h-draw-app.apk`

            ### App 内更新
            用户安装后启动 App，会检查：
            ```
            https://app.hdraw.de/version.json
            ```
            若 `versionCode` 更大则提示更新。

            ### 服务器更新
            ```bash
            # 1) 上传 APK（可选）
            # scp h-draw-app.apk root@服务器:/var/www/app.hdraw.de/

            # 2) 更新 version.json
            curl -L -o /var/www/app.hdraw.de/version.json \
              https://raw.githubusercontent.com/${{ github.repository }}/main/version.json
            ```
          # 若仓库/工作区里已有 APK，会附带到 Release；没有也不失败
          files: |
            h-draw-app.apk
            unpackage/release/**/*.apk
          fail_on_unmatched_files: false
