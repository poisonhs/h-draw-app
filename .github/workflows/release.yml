name: 编译未签名 IPA

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解析版本号
        id: version
        run: |
          TAG=${GITHUB_REF_NAME#v}
          echo "version_name=$TAG" >> $GITHUB_OUTPUT
          # 1.0.8 → 108（与 manifest.versionCode 规则一致）
          CODE=$(echo "$TAG" | awk -F. '{print $1*100 + $2*10 + $3}')
          echo "version_code=$CODE" >> $GITHUB_OUTPUT

      - name: 编译未签名 .app（ObjC + WKWebView）
        run: |
          APP="build/ios"
          NAME="H-DRAW"
          OUTPUT="build/$NAME.app"
          mkdir -p "$OUTPUT"

          SDK=$(xcrun --sdk iphoneos --show-sdk-path)

          clang -isysroot "$SDK" \
            -target arm64-apple-ios15.0 \
            -fobjc-arc \
            -fmodules \
            -framework UIKit \
            -framework WebKit \
            -framework Foundation \
            -o "$OUTPUT/$NAME" \
            "$APP/main.m"

          cp "$APP/Info.plist" "$OUTPUT/"
          plutil -replace CFBundleShortVersionString \
            -string "${{ steps.version.outputs.version_name }}" "$OUTPUT/Info.plist"
          plutil -replace CFBundleVersion \
            -string "${{ steps.version.outputs.version_code }}" "$OUTPUT/Info.plist"
          plutil -replace CFBundleDisplayName -string "H-DRAW" "$OUTPUT/Info.plist"

          # ad-hoc 签名（AltStore/SideStore 会重新签名）
          codesign --force --deep -s - "$OUTPUT" 2>/dev/null || true

      - name: 生成未签名 IPA
        run: |
          mkdir -p build/Payload
          cp -r build/H-DRAW.app build/Payload/
          cd build
          zip -r H-DRAW.ipa Payload/
          rm -rf Payload
          ls -lh H-DRAW.ipa

      - name: 更新 version.json 并推到 main
        run: |
          cat > version.json << EOF
          {
            "versionCode": ${{ steps.version.outputs.version_code }},
            "versionName": "${{ steps.version.outputs.version_name }}",
            "url": "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/H-DRAW.ipa",
            "note": "新版本发布"
          }
          EOF
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git fetch origin main
          git checkout -B main origin/main
          git add version.json
          git commit -m "chore: version ${{ steps.version.outputs.version_name }}" || true
          git push origin main || true

      - name: 创建 Release 并上传 IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: H-DRAW ${{ steps.version.outputs.version_name }}
          body: |
            ## H-DRAW ${{ steps.version.outputs.version_name }}

            ### iOS 安装说明
            此 IPA **未经苹果签名**，需用侧载工具安装到 iPhone：

            | 工具 | 平台 | 使用方法 |
            |------|------|----------|
            | [AltStore](https://altstore.io) | macOS | 电脑安装 AltServer → 数据线连接 iPhone → 拖入 IPA |
            | [SideStore](https://sidestore.io) | macOS | 同上，支持无线 |
            | [Sideloadly](https://sideloadly.io) | Win/Mac | 免费，直接拖入 IPA 自动签名安装 |
            | [TrollStore](https://trollstore.app) | iOS | 支持 iOS 14-17，直接安装未签名 IPA |

            ### 服务器更新
            ```bash
            curl -L -o /var/www/app.hdraw.de/version.json \
              https://raw.githubusercontent.com/${{ github.repository }}/main/version.json
            ```
          files: build/H-DRAW.ipa
